<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Axiom Wallet — Meme Coin Trading & Swap Platform</title>
    <meta name="description" content="Next-generation crypto wallet and meme coin trading portal with instant execution, Trust Wallet-styled charts, and secure custodial ledger." />
    <meta name="theme-color" content="#0A0B14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="apple-mobile-web-app-title" content="Axiom" />
    <meta name="application-name" content="Axiom Wallet" />

    <!-- Favicon & Home Screen Icons -->
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" href="/axiom-icon.png" />
    <link rel="shortcut icon" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
    <script>
      (function() {
        try {
          var params = new URLSearchParams(window.location.search);
          var t = params.get('theme') || localStorage.getItem('axiom_theme');
          if (!t) {
            t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.colorScheme = t;
        } catch(e) {}

        // Register Service Worker with instant auto-update & cache bust for PWA
        if ('serviceWorker' in navigator) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js?v=3').then(function(reg) {
              console.log('[Axiom PWA] Service Worker registered with scope:', reg.scope);
              reg.update();
              if (reg.waiting) {
                reg.waiting.postMessage({ type: 'SKIP_WAITING' });
              }
              reg.addEventListener('updatefound', function() {
                var newWorker = reg.installing;
                if (newWorker) {
                  newWorker.addEventListener('statechange', function() {
                    if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                      newWorker.postMessage({ type: 'SKIP_WAITING' });
                    }
                  });
                }
              });
            }).catch(function(err) {
              console.log('[Axiom PWA] Service Worker registration skipped:', err);
            });

            var refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', function() {
              if (!refreshing) {
                refreshing = true;
                window.location.reload();
              }
            });
          });
        }
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="axiom-initial-loader" style="position:fixed;inset:0;background:#0A0B14;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999999;font-family:'Outfit','Inter',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;">
        <style>
          @keyframes axiomInitialPulse {
            0%, 100% {
              transform: scale(1);
              filter: drop-shadow(0 0 16px rgba(124, 58, 237, 0.6)) drop-shadow(0 0 6px rgba(6, 182, 212, 0.4));
            }
            50% {
              transform: scale(1.05);
              filter: drop-shadow(0 0 28px rgba(124, 58, 237, 0.85)) drop-shadow(0 0 14px rgba(6, 182, 212, 0.65));
            }
          }
          @keyframes axiomInitialBar {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
          }
        </style>
        <div style="position:relative;width:72px;height:72px;display:flex;align-items:center;justify-content:center;margin-bottom:18px;">
          <img src="/axiom-icon.png" alt="Axiom" style="width:72px;height:72px;object-fit:contain;animation:axiomInitialPulse 2.4s ease-in-out infinite;" />
        </div>
        <div style="font-family:'Outfit',sans-serif;font-weight:800;font-size:18px;letter-spacing:0.18em;color:#FFFFFF;margin-bottom:6px;text-transform:uppercase;">
          AXIOM WALLET
        </div>
        <div style="font-family:'Inter',sans-serif;font-size:12px;letter-spacing:0.04em;color:#94A3B8;margin-bottom:20px;">
          Loading secure platform...
        </div>
        <div style="width:130px;height:3px;background:rgba(255,255,255,0.08);border-radius:999px;overflow:hidden;position:relative;">
          <div style="position:absolute;top:0;left:0;height:100%;width:40%;background:linear-gradient(90deg, #7C3AED, #06B6D4);border-radius:999px;animation:axiomInitialBar 1.4s ease-in-out infinite;"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
