services:
  # ─────────────────────────────────────────────────────────────
  # Axiom Wallet Backend (Django REST Framework)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: axiom-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: server
    buildCommand: "./build.sh"
    startCommand: "gunicorn axiom_core.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: postgresql://axiomdb_0iwa_user:woiJxKHDSJv0xkZC1VS53BTN5M40fTAN@dpg-dap8k5id0e5s73f3gvqg-a.oregon-postgres.render.com/axiomdb_0iwa
      - key: FRONTEND_URL
        fromService:
          type: web
          name: axiom-frontend
          property: host

  # ─────────────────────────────────────────────────────────────
  # Axiom Wallet Frontend (React + Vite SPA)
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: axiom-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: client
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: axiom-backend
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
